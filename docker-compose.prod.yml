# ============================================
# PETTIES - Unified Deploy Compose (Test + Prod)
# One compose file for both environments. Only switch --env-file.
# Example:
#   docker compose -p petties-test -f docker-compose.prod.yml --env-file .env.test up -d --build
#   docker compose -p petties-prod -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ============================================

services:
  backend:
    build:
      context: ./backend-spring/petties
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MONGO_URI: ${MONGO_URI:-}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_WEB_CLIENT_ID.apps.googleusercontent.com}
      # Google OAuth (Mobile - Android & iOS)
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      # Firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-petties-app}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-}
      SEPAY_BASE_URL: ${SEPAY_BASE_URL:-https://my.sepay.vn/userapi}
      # Sepay QR Payment
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-}
      SEPAY_QR_ACC: ${SEPAY_QR_ACC:-}
      SEPAY_QR_BANK: ${SEPAY_QR_BANK:-}
      SENTRY_DSN: ${SENTRY_BACKEND_DSN:-}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # JWT Expiration
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.petties.world}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xmx320m -Xms256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
    ports:
      - 127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080
    networks:
      - petties-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-384M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ai-service:
    build:
      context: ./petties-agent-serivce
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
    restart: unless-stopped
    environment:
      APP_NAME: ${AI_APP_NAME:-Petties Agent Service}
      APP_ENV: ${AI_APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${AI_WORKERS:-2}
      DATABASE_URL: ${DATABASE_URL:-}
      MONGODB_URL: ${MONGO_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-petties_nosql}
      JWT_SECRET: ${JWT_SECRET:-}
      SECRET_KEY: ${JWT_SECRET:-}
      SPRING_BACKEND_URL: http://backend:8080
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-petties_knowledge_base_prod}
      CASE_MEMORY_COLLECTION: ${CASE_MEMORY_COLLECTION:-petties_case_memory_v2_prod}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.petties.world}
      # OpenRouter (LLM) - CRITICAL
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-meta-llama/llama-3.3-70b-instruct}
      # Cohere (Embeddings) - CRITICAL
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_EMBEDDING_MODEL: ${COHERE_EMBEDDING_MODEL:-embed-multilingual-v3.0}
      # Tavily Web Search (Optional)
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-5}
      # Jina Image Embeddings (Optional)
      JINA_API_KEY: ${JINA_API_KEY:-}
      JINA_IMAGE_EMBED_MODEL: ${JINA_IMAGE_EMBED_MODEL:-jina-clip-v2}
      MCP_TIMEOUT: ${MCP_TIMEOUT:-30}
      # JWT / Upload / Logging
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      LOG_FILE: ${AI_LOG_FILE:-./logs/agent_service.log}
      SENTRY_DSN: ${SENTRY_AI_SERVICE_DSN:-}
    ports:
      - 127.0.0.1:${AI_HOST_PORT:-8000}:8000
    networks:
      - petties-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${AI_MEMORY_LIMIT:-384M}
        reservations:
          memory: ${AI_MEMORY_RESERVATION:-256M}
    volumes:
      - ai_storage_data:/app/storage
      - ai_uploads_data:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${NGINX_HOST_PORT:-80}:80
      - ${NGINX_HTTPS_PORT:-443}:443
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-api.petties.world}
      NGINX_FRONTEND_UPSTREAM: ${NGINX_FRONTEND_UPSTREAM:-https://www.petties.world}
      NGINX_FRONTEND_HOST: ${NGINX_FRONTEND_HOST:-www.petties.world}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-8.8.8.8}
      NGINX_SSL_CERT: ${NGINX_SSL_CERT:-/etc/letsencrypt/live/${NGINX_SERVER_NAME}/fullchain.pem}
      NGINX_SSL_KEY: ${NGINX_SSL_KEY:-/etc/letsencrypt/live/${NGINX_SERVER_NAME}/privkey.pem}
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: >
      /bin/sh -c "envsubst '$$NGINX_SERVER_NAME $$NGINX_FRONTEND_UPSTREAM $$NGINX_FRONTEND_HOST $$NGINX_RESOLVER $$NGINX_SSL_CERT $$NGINX_SSL_KEY'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - backend
      - ai-service
    networks:
      - petties-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - 127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090
    depends_on:
      - backend
      - ai-service
    networks:
      - petties-network

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - 127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000
    depends_on:
      - prometheus
    networks:
      - petties-network

networks:
  petties-network:
    driver: bridge

volumes:
  ai_storage_data:
    driver: local
  ai_uploads_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
