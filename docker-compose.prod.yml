# ============================================
# PETTIES - Unified Deploy Compose (Test + Prod)
# One compose file for both environments. Only switch --env-file.
# Example:
#   docker compose -p petties-test -f docker-compose.prod.yml --env-file .env.test up -d --build
#   docker compose -p petties-prod -f docker-compose.prod.yml --env-file .env.prod up -d --build
# ============================================

services:
  backend:
    build:
      context: ./backend-spring/petties
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      MONGO_URI: ${MONGO_URI:-}
      APP_AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_WEB_CLIENT_ID.apps.googleusercontent.com}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_BACKEND_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      GOONG_API_KEY: ${GOONG_API_KEY:-}
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xmx320m -Xms256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
    ports:
      - 127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080
    networks:
      - petties-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION:-384M}

  ai-service:
    build:
      context: ./petties-agent-serivce
      dockerfile: Dockerfile
      args:
        BUILD_ENV: ${BUILD_ENV:-prod}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      MONGODB_URL: ${MONGODB_URL:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-petties_nosql}
      JWT_SECRET: ${JWT_SECRET:-}
      SECRET_KEY: ${JWT_SECRET:-}
      SPRING_BACKEND_URL: http://backend:8080
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-petties_knowledge_base}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.petties.world}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-}
      SENTRY_DSN: ${SENTRY_AI_SERVICE_DSN:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
    ports:
      - 127.0.0.1:${AI_HOST_PORT:-8000}:8000
    networks:
      - petties-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${AI_MEMORY_LIMIT:-384M}
        reservations:
          memory: ${AI_MEMORY_RESERVATION:-256M}
    volumes:
      - ai_storage_data:/app/storage
      - ai_uploads_data:/app/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - ${NGINX_HOST_PORT:-80}:80
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-api.petties.world}
      NGINX_FRONTEND_UPSTREAM: ${NGINX_FRONTEND_UPSTREAM:-https://www.petties.world}
      NGINX_FRONTEND_HOST: ${NGINX_FRONTEND_HOST:-www.petties.world}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-8.8.8.8}
    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    command: >
      /bin/sh -c "envsubst '$$NGINX_SERVER_NAME $$NGINX_FRONTEND_UPSTREAM $$NGINX_FRONTEND_HOST $$NGINX_RESOLVER'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - backend
      - ai-service
    networks:
      - petties-network

networks:
  petties-network:
    driver: bridge

volumes:
  ai_storage_data:
    driver: local
  ai_uploads_data:
    driver: local
