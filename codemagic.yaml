workflows:
  ios-shorebird-build:
    name: Petties Mobile iOS - Shorebird Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: petties_mobile
    environment:
      groups:
        - google-service-account
      flutter: stable
      xcode: latest
      vars:
        ENV: "dev"
        COCOAPODS_DISABLE_STATS: "true"
    scripts:
      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          $HOME/.shorebird/bin/shorebird --version
      - name: Create .env from CodeMagic Variables
        script: |
          cat > .env << 'ENVEOF'
          API_BASE_URL=https://api-test.petties.world
          AI_SERVICE_URL=https://api-test.petties.world
          WS_URL=wss://api-test.petties.world
          GOOGLE_CLIENT_ID=620454234596-vv1v2t95mmsvpgfj6h2oodj0030fguia.apps.googleusercontent.com
          GOONG_API_KEY=wFNRmlVOfptNJb1489XgcutaXwZc2FBJJPU3VQ0j
          MAP_API_KEY=AIzaSyC-IQBcX0Sbbhb0seXwGdUbkvB5rSBUoic
          SENTRY_DSN=
          ENVIRONMENT=dev
          ENVEOF
          # Xóa khoảng trắng đầu dòng do heredoc
          sed -i 's/^[[:space:]]*//' .env
          echo "✅ .env file created:"
          cat .env
      - name: Flutter pub get
        script: flutter pub get
      - name: Configure Git and Install Pods
        script: |
          cd ios
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          n=0
          until [ "$n" -ge 3 ]
          do
             pod install && break
             n=$((n+1))
             echo "Pod install failed... retrying ($n/3)"
             sleep 5
          done
      - name: Shorebird Release iOS
        script: |
          # Thử release, nếu version đã tồn tại thì bỏ qua (app đã build xong)
          $HOME/.shorebird/bin/shorebird release ios --no-codesign || {
            echo "⚠️ Shorebird release failed (version may already exist). App was already built, continuing..."
          }
      - name: Package IPA for Sideloading
        script: |
          # Tìm Runner.app chính xác
          RUNNER_APP=$(find build/ios -name "Runner.app" -type d | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "❌ Runner.app not found!"
            find build -name "Runner.app" -type d || true
            ls -la build/ios/iphoneos/ || true
            exit 1
          fi
          
          echo "✅ Found Runner.app at: $RUNNER_APP"
          
          # Tạo IPA chuẩn
          rm -rf Payload Runner.ipa
          mkdir -p Payload
          cp -r "$RUNNER_APP" Payload/
          zip -r Runner.ipa Payload
          
          # Verify
          ls -la Runner.ipa
          echo "✅ IPA ready: $(du -h Runner.ipa)"
    artifacts:
      - Runner.ipa
      - build/ios/archive/Runner.xcarchive/**/*.ipa
      - ./**/*.ipa
