workflows:
  ios-release-build:
    name: Flutter Release iOS (for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: petties_mobile
    environment:
      groups:
        - google-service-account
      flutter: stable
      xcode: latest
    scripts:
      - name: Create .env if missing
        script: |
          if [ ! -f .env ]; then
            touch .env
            echo "API_BASE_URL=$API_BASE_URL" > .env
          fi
      - name: Flutter pub get
        script: flutter pub get
      - name: Install Pods
        script: |
          cd ios
          pod install
      - name: Flutter build iOS (Release)
        script: flutter build ios --release --no-codesign
      - name: Package IPA for Sideloading
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
    artifacts:
      - petties_mobile/Runner.ipa
