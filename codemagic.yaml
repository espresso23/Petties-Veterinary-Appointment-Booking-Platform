workflows:
  ios-release-build:
    name: Petties Mobile iOS - Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: petties_mobile
    environment:
      groups:
        - google-service-account
      flutter: stable
      xcode: latest
      vars:
        ENV: "dev"
        COCOAPODS_DISABLE_STATS: "true"
    scripts:
      - name: Create .env from CodeMagic Variables
        script: |
          echo "ENV=$ENV" > .env
          echo "API_BASE_URL=$API_BASE_URL" >> .env
          cat .env
      - name: Flutter pub get
        script: flutter pub get
      - name: Configure Git and Install Pods
        script: |
          cd ios
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          n=0
          until [ "$n" -ge 3 ]
          do
             pod install && break
             n=$((n+1))
             echo "Pod install failed... retrying ($n/3)"
             sleep 5
          done
      - name: Flutter build iOS (Release)
        script: flutter build ios --release --no-codesign
      - name: Package IPA for Sideloading
        script: |
          rm -rf Payload Runner.ipa
          mkdir -p Payload
          # Tìm Runner.app trong xcarchive hoặc iphoneos
          RUNNER_APP=$(find build -name "Runner.app" -type d | head -1)
          if [ -z "$RUNNER_APP" ]; then
            echo "❌ Runner.app not found!"
            find build -maxdepth 4 -type d
            exit 1
          fi
          echo "✅ Found Runner.app at: $RUNNER_APP"
          cp -r "$RUNNER_APP" Payload/
          zip -r Runner.ipa Payload
    artifacts:
      - petties_mobile/Runner.ipa
