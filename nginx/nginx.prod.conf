# ============================================
# PETTIES - Production Nginx Configuration
# Domain: petties.world / www.petties.world
# Routes:
#   /api/*        -> Backend (Spring Boot)
#   /ai/*         -> AI Service (FastAPI)
#   /ws/chat/*    -> AI Service WebSocket
#   /             -> Vercel Frontend
# ============================================

server {
    listen 80;
    server_name petties.world www.petties.world;

    client_max_body_size 60M;
    resolver 8.8.8.8 8.8.4.4 ipv6=off valid=30s;

    # ============================================
    # BACKEND API - /api/* (excluding /api/v1/*)
    # ============================================
    location /api/ws-native {
        proxy_pass http://backend:8080/api/ws-native;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # AI WEBSOCKET - /ws/chat/*
    # ============================================
    location /ws/chat/ {
        proxy_pass http://ai-service:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ============================================
    # AI SERVICE - /ai/* (REST API)
    # ============================================
    location /ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # ============================================
    # FRONTEND - Vercel (catch-all)
    # ============================================
    location / {
        proxy_pass https://www.petties.world;
        proxy_http_version 1.1;
        proxy_set_header Host www.petties.world;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}