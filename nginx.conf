server {
    listen 80;
    server_name localhost;

    # ============================================
    # GLOBAL SETTINGS
    # ============================================
    client_max_body_size 15M;
    # Resolve Docker service names dynamically to avoid stale upstream IPs
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ============================================
    # BACKEND API WEBSOCKET - /api/ws-native (Phải đặt TRƯỚC /api)
    # ============================================
    location /api/ws-native {
        set $backend_api_ws_upstream http://backend:8080;
        proxy_pass $backend_api_ws_upstream/api/ws-native;
        proxy_http_version 1.1;

        # WebSocket headers - BẮT BUỘC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # BACKEND API - REST endpoints
    # ============================================
    location /api {
        set $backend_api_upstream http://backend:8080;
        proxy_pass $backend_api_upstream;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # AI SERVICE WEBSOCKET - /ws/chat/* (Phải đặt TRƯỚC /ws/*)
    # ============================================
    location /ws/chat/ {
        set $ai_ws_upstream http://ai-service:8000;
        proxy_pass $ai_ws_upstream/ws/chat/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # BACKEND WEBSOCKET - /ws/* và /ws-native/*
    # ============================================
    location /ws/ {
        set $backend_ws_upstream http://backend:8080;
        proxy_pass $backend_ws_upstream/ws/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    location /ws-native/ {
        set $backend_ws_native_upstream http://backend:8080;
        proxy_pass $backend_ws_native_upstream/ws-native/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # FRONTEND - React/Vite (Host machine)
    # ============================================
    location / {
        set $frontend_upstream http://host.docker.internal:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR (Hot Module Replacement) support
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================
    # AI SERVICE - REST endpoints
    # ============================================
    location /ai/ {
        set $ai_rest_upstream http://ai-service:8000;
        proxy_pass $ai_rest_upstream/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
