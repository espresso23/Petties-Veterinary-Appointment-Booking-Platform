server {
    listen 80;
    server_name localhost;

    # ============================================
    # GLOBAL SETTINGS
    # ============================================
    client_max_body_size 60M;  # Tăng từ 15M để hỗ trợ PDF lớn (300+ trang, ~18MB)
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ============================================
    # BACKEND API WEBSOCKET - /api/ws-native (Phải đặt TRƯỚC /api)
    # ============================================
    location /api/ws-native {
        proxy_pass http://backend:8080/api/ws-native;
        proxy_http_version 1.1;

        # WebSocket headers - BẮT BUỘC
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # AI SERVICE - REST API via /api/v1 prefix
    # Phải đặt TRƯỚC /api vì nginx chọn longest prefix match
    # Spring Boot dùng /api/*, AI Service dùng /api/v1/*
    # Dùng host.docker.internal để hỗ trợ cả AI service chạy local và Docker
    # ============================================
    location /api/v1/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts - Increased for AI processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ============================================
    # BACKEND API - REST endpoints
    # ============================================
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # AI SERVICE WEBSOCKET - /ws/chat/* (Phải đặt TRƯỚC /ws/*)
    # ============================================
    location /ws/chat/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # BACKEND WEBSOCKET - /ws/* và /ws-native/*
    # ============================================
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    location /ws-native/ {
        proxy_pass http://backend:8080/ws-native/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # ============================================
    # FRONTEND - React/Vite (Host machine)
    # ============================================
    location / {
        # Use Docker DNS resolver with ipv6=off to force IPv4
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $frontend_upstream http://host.docker.internal:5173;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HMR (Hot Module Replacement) support
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================
    # AI SERVICE - REST endpoints
    # ============================================
    location /ai/ {
        proxy_pass http://host.docker.internal:8000/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts - Increased for document upload/processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for large file uploads
        proxy_request_buffering off;
    }
}


