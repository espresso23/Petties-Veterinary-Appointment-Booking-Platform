global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: petties-backend
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: petties-ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
