name: Deploy to Test Environment

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs-references/**'
      - 'postman/**'

jobs:
  deploy-backend-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 Test Environment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/petties-backend/Petties-Veterinary-Appointment-Booking-Platform
            ENV_FILE=.env.test
            COMPOSE_FILE=docker-compose.prod.yml
            
            echo "🧪 ============================================"
            echo "🧪 Deploying TEST environment..."
            echo "🧪 ============================================"
            
            # Fetch and checkout develop branch
            echo "📥 Fetching latest code from develop branch..."
            git fetch origin
            git checkout develop
            git reset --hard origin/develop

            mkdir -p backend-spring/petties/src/main/resources/
            cat <<EOF > backend-spring/petties/src/main/resources/firebase-service-account.json
            ${{ secrets.FIREBASE_JSON }}
            EOF
            
            echo "📋 Current commit:"
            git log --oneline -1
            
            # Check if test environment file exists
            if [ ! -f "$ENV_FILE" ]; then
              echo "⚠️ $ENV_FILE not found! Please create it first."
              exit 1
            fi

            set -a
            . "$ENV_FILE"
            set +a

            export COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-petties-test}
            export BACKEND_HOST_PORT=${BACKEND_HOST_PORT:-8081}
            export AI_HOST_PORT=${AI_HOST_PORT:-8001}
            export NGINX_HOST_PORT=${NGINX_HOST_PORT:-81}
            export NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-api-test.petties.world}
            export NGINX_FRONTEND_UPSTREAM=${NGINX_FRONTEND_UPSTREAM:-https://test.petties.world}
            export NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-test.petties.world}
            export NGINX_RESOLVER=${NGINX_RESOLVER:-8.8.8.8}

            COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-petties-test}
            
            # Stop existing test containers
            echo "🛑 Stopping test containers..."
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down 2>/dev/null || true
            
            # Build and start test containers
            echo "🔨 Building and starting test containers..."
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --build
            
            echo "⏳ Waiting for services to start..."
            sleep 20
            
            # Health checks for Test environment
            echo "🏥 Checking test backend health (port ${BACKEND_HOST_PORT:-8081})..."
            curl -f "http://127.0.0.1:${BACKEND_HOST_PORT:-8081}/api/actuator/health" || echo "⚠️ Backend Test health check failed"
            
            echo "🤖 Checking test AI service health (port ${AI_HOST_PORT:-8001})..."
            curl -f "http://127.0.0.1:${AI_HOST_PORT:-8001}/health" || echo "⚠️ AI Test health check failed"
            
            echo "📜 Showing recent test logs..."
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=20
            
            echo "🧪 ============================================"
            echo "✅ Test Deployment complete!"
            echo "🌐 FE: https://test.petties.world"
            echo "🔌 BE: https://api-test.petties.world/api (unified domain)"
            echo "🤖 AI:  https://api-test.petties.world/ai (unified domain)"
            echo "🧪 ============================================"
