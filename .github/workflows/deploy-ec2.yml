name: Deploy to Production

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs-references/**'
      - 'postman/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/petties-backend/Petties-Veterinary-Appointment-Booking-Platform"
            REPO_URL="https://github.com/espresso23/Petties-Veterinary-Appointment-Booking-Platform.git"
            BRANCH="main"
            ENV_FILE=.env.prod
            COMPOSE_FILE=docker-compose.prod.yml

            echo "📁 Preparing production repository..."
            mkdir -p "$HOME/petties-backend"
            # Ensure GitHub host fingerprint is trusted to avoid host key verification failures
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            chmod 644 "$HOME/.ssh/known_hosts" || true
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "📥 Repository not found, cloning from GitHub..."
              git clone --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            
            echo "🚀 ============================================"
            echo "🚀 Deploying PRODUCTION environment..."
            echo "🚀 ============================================"
            
            echo "📥 Fetching latest code from origin..."
            git fetch origin
            
            echo "🔄 Resetting to origin/main (ensures exact sync)..."
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            mkdir -p backend-spring/petties/src/main/resources/
            cat <<EOF > backend-spring/petties/src/main/resources/firebase-service-account.json
            ${{ secrets.FIREBASE_JSON }}
            EOF

            if [ ! -f "$ENV_FILE" ]; then
              if [ -f ".env.example" ]; then
                echo "ℹ️ $ENV_FILE not found — copying from .env.example"
                cp .env.example "$ENV_FILE"
              else
                echo "⚠️ $ENV_FILE and .env.example not found! Please provide one."
                exit 1
              fi
            fi

            # Load env safely, preserving values with spaces (e.g. JAVA_OPTS).
            if [ -f "$ENV_FILE" ]; then
              set -a
              # shellcheck disable=SC1090
              source <(grep -v '^[[:space:]]*#' "$ENV_FILE" | grep -v '^[[:space:]]*$')
              set +a
            fi

            export COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-petties-prod}
            export BACKEND_HOST_PORT=${BACKEND_HOST_PORT:-8080}
            export AI_HOST_PORT=${AI_HOST_PORT:-8000}
            export NGINX_HOST_PORT=${NGINX_HOST_PORT:-80}
            export NGINX_HTTPS_PORT=${NGINX_HTTPS_PORT:-443}
            export NGINX_SERVER_NAME=${NGINX_SERVER_NAME:-api.petties.world}
            export NGINX_FRONTEND_UPSTREAM=${NGINX_FRONTEND_UPSTREAM:-https://www.petties.world}
            export NGINX_FRONTEND_HOST=${NGINX_FRONTEND_HOST:-www.petties.world}
            export NGINX_RESOLVER=${NGINX_RESOLVER:-8.8.8.8}

            COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-petties-prod}

            echo "🔐 Preparing Monitoring Basic Auth (Grafana/Prometheus)..."
            # Use existing Grafana admin credentials from env file for basic auth.
            # This keeps monitoring endpoints protected while avoiding extra secrets wiring.
            mkdir -p nginx
            if [ -z "${GRAFANA_ADMIN_USER:-}" ] || [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "❌ Missing GRAFANA_ADMIN_USER/GRAFANA_ADMIN_PASSWORD in ${ENV_FILE}"
              exit 1
            fi
            # Generate htpasswd (apr1). Avoid printing password in logs.
            MONITORING_HTPASSWD_HASH="$(openssl passwd -apr1 "${GRAFANA_ADMIN_PASSWORD}")"
            printf "%s:%s\n" "${GRAFANA_ADMIN_USER}" "${MONITORING_HTPASSWD_HASH}" > nginx/monitoring.htpasswd
            
            echo "📋 Current commit:"
            git log --oneline -1

            echo "🧹 Pre-deployment cleanup (Safe for Data)..."
            # Loại bỏ toàn bộ các image không còn container nào sử dụng và build cache cũ
            # KHÔNG sử dụng flag --volumes để bảo vệ dữ liệu database/uploads của Prod
            docker image prune -af
            docker builder prune -af

            echo "🧽 Removing conflicting containers (if any)..."
            docker rm -f ${COMPOSE_PROJECT}_backend-1 ${COMPOSE_PROJECT}_ai-service-1 || true

            echo "🛑 Stopping production containers..."
            docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down --remove-orphans

            echo "🔎 Port preflight for Nginx (${NGINX_HOST_PORT}/${NGINX_HTTPS_PORT})..."
            if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nginx; then
              echo "⚠️ Host nginx service is active. Stopping to avoid port conflict..."
              sudo systemctl stop nginx || true
            fi

            free_port_or_fail() {
              _port="$1"

              # Remove foreign Docker containers that publish the target port.
              foreign_ids="$(docker ps -q --filter "publish=${_port}")"
              if [ -n "$foreign_ids" ]; then
                for cid in $foreign_ids; do
                  cname="$(docker inspect --format '{{.Name}}' "$cid" | sed 's#^/##')"
                  if [[ "$cname" != ${COMPOSE_PROJECT}_* ]]; then
                    echo "⚠️ Removing foreign container using port ${_port}: ${cname}"
                    docker rm -f "$cid" || true
                  fi
                done
              fi

              # If still busy by host process, fail fast with diagnostics.
              if ss -ltn "( sport = :${_port} )" | grep -q ":${_port}"; then
                echo "❌ Port ${_port} is still occupied by host process."
                ss -ltnp "( sport = :${_port} )" || true
                exit 1
              fi
            }

            free_port_or_fail "$NGINX_HOST_PORT"
            free_port_or_fail "$NGINX_HTTPS_PORT"
            
            echo "🔨 Building backend image..."
            docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build backend
            docker image prune -f

            echo "🔨 Building ai-service image..."
            docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build ai-service
            docker image prune -f

            echo "🚀 Starting production containers..."
            docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" --profile monitoring up -d --remove-orphans
            
            echo "⏳ Waiting for services to start..."
            sleep 30

            wait_for_http_health() {
              _name="$1"
              _url="$2"
              _max_attempts="${3:-30}"
              _sleep_seconds="${4:-3}"

              echo "🏥 Checking ${_name} health: ${_url}"
              _attempt=1
              while [ "$_attempt" -le "$_max_attempts" ]; do
                if curl -fsS "$_url" >/dev/null 2>&1; then
                  echo "✅ ${_name} healthy (attempt ${_attempt}/${_max_attempts})"
                  return 0
                fi
                echo "⏳ ${_name} not ready yet (${_attempt}/${_max_attempts}), retrying in ${_sleep_seconds}s..."
                _attempt=$((_attempt + 1))
                sleep "$_sleep_seconds"
              done

              echo "❌ ${_name} health check failed after ${_max_attempts} attempts."
              return 1
            }

            if ! wait_for_http_health "Backend" "http://127.0.0.1:${BACKEND_HOST_PORT:-8080}/api/actuator/health" 30 3; then
              echo "📜 Backend logs (last 200 lines):"
              docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=200 backend || true
              exit 1
            fi

            if ! wait_for_http_health "AI service" "http://127.0.0.1:${AI_HOST_PORT:-8000}/health" 20 3; then
              echo "📜 AI service logs (last 200 lines):"
              docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=200 ai-service || true
              exit 1
            fi
            
            echo "📜 Showing recent logs..."
            docker-compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" --env-file "$ENV_FILE" logs --tail=30
            
            echo "🧹 Cleaning up Docker resources (safe mode, no volumes)..."
            docker image prune -af || true
            docker builder prune -af || true
            
            echo "🚀 ============================================"
            echo "✅ Production Deployment complete!"
            echo "🌐 FE: https://www.petties.world"
            echo "🔌 BE: https://api.petties.world/api (unified domain)"
            echo "🤖 AI:  https://api.petties.world/ai (unified domain)"
            echo "🚀 ============================================"
